services:
  - type: web
    name: spinenet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PUBLIC_MODE
        value: "1"
      - key: DB_PATH
        value: demo/catalog.db
      - key: ORT_THREADS
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://kostya785.github.io
